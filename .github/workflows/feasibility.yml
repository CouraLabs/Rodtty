name: Terminal feasibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers vim
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --bins
      - run: cargo test --locked --all-targets -- --test-threads=1
      - name: Real Vim integration
        if: runner.os == 'Linux'
        run: cargo test --locked --test terminal real_vim_accepts_keyboard_input_and_saves_a_file -- --ignored
      - name: Rune renderer smoke check
        if: runner.os == 'Linux'
        run: target/debug/rodtty --scene preview --snap target/terminal-preview.png --size 1080x720 --scale 1
