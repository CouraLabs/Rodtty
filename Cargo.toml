[package]
name = "rodtty"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Cross-platform terminal with a file explorer, editor, and Git diffs"
default-run = "rodtty"

[features]
default = ["desktop"]
desktop = ["dep:rune", "dep:rune-kit", "dep:fontique", "dep:read-fonts", "rune-kit/markdown"]

[dependencies]
anyhow = "1"
crossterm = "0.29"
fs2 = "0.4"
notify = "8"
brush-shell = { git = "https://github.com/reubeno/brush", rev = "fbd1eb36158384bbd5ad542445a5324bebefce78", default-features = false, features = ["vt", "minimal"] }
brush-coreutils-builtins = { git = "https://github.com/reubeno/brush", rev = "fbd1eb36158384bbd5ad542445a5324bebefce78", features = ["coreutils.cat", "coreutils.ls", "coreutils.cp", "coreutils.mv", "coreutils.rm", "coreutils.mkdir", "coreutils.head", "coreutils.tail", "coreutils.wc", "coreutils.sort", "coreutils.touch", "coreutils.sleep", "coreutils.env", "coreutils.seq"] }
directories = "6"
dunce = "1"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
similar = "2"
wait-timeout = "0.2"
vt100 = "0.16"
rune = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c9f77b1a0051d8e1e5ee936ebea086bb90", default-features = false, features = ["accessibility", "embedded-fonts", "dbus", "tooling", "svg"], optional = true }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c9f77b1a0051d8e1e5ee936ebea086bb90", optional = true }

fontique = { version = "0.12", features = ["std", "system", "fontconfig-dlopen"], optional = true }
read-fonts = { version = "0.41", optional = true }
trash = { version = "=5.3.0", default-features = false, features = ["chrono", "coinit_apartmentthreaded", "freedesktop"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[patch.crates-io]
trash = { path = "vendor/trash" }
vte = { path = "vendor/vte" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c9f77b1a0051d8e1e5ee936ebea086bb90" }
winit = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c9f77b1a0051d8e1e5ee936ebea086bb90" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "eb5ae6c9f77b1a0051d8e1e5ee936ebea086bb90" }

[[bin]]
name = "rodtty"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "rodtty-shell"
path = "src/bin/shell.rs"

[[bin]]
name = "rodtty-probe"
path = "src/bin/probe.rs"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[patch."https://github.com/anomalyco/rune"]
rune = { path = "vendor/rune" }
rune-kit = { path = "vendor/rune-kit" }
